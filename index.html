<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Utama</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
      background:
        radial-gradient(circle at top left, #294477, transparent 35%),
        radial-gradient(circle at bottom right, #612277, transparent 35%),
        #090d19;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 35px 30px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(15px);
    }

    .logo {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 20px;
      font-size: 32px;
      font-weight: bold;
      background: linear-gradient(135deg, #19bfff, #8b45ff);
      box-shadow: 0 10px 30px rgba(66, 113, 255, 0.4);
    }

    h1 {
      margin-bottom: 8px;
      text-align: center;
      font-size: 27px;
    }

    .subtitle {
      margin-bottom: 27px;
      color: #abb4c9;
      text-align: center;
      font-size: 14px;
    }

    /* Tombol tersusun kiri dan kanan */
    .button-menu {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .menu-button {
      min-height: 96px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      background: rgba(17, 26, 51, 0.85);
      transition: 0.2s;
    }

    .menu-button:hover {
      transform: translateY(-3px);
      filter: brightness(1.15);
      border-color: #4dbfff;
    }

    .menu-button span {
      font-size: 27px;
    }

    .page-content {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 13px;
      color: #dce3f3;
      line-height: 1.6;
      background: rgba(7, 12, 25, 0.65);
    }

    .page-content h2 {
      margin-bottom: 8px;
      color: #68cdff;
      font-size: 19px;
    }

    .back-button {
      margin-top: 14px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      background: #52617e;
    }

    .back-button:hover {
      background: #647594;
    }

    @media (max-width: 380px) {
      .card {
        padding: 28px 18px;
      }

      .button-menu {
        gap: 10px;
      }

      .menu-button {
        min-height: 88px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">☰</div>

    <h1>Menu Utama</h1>
    <p class="subtitle">
      Silakan pilih menu yang ingin dibuka.
    </p>

    <div id="mainMenu" class="button-menu">

      <button
        type="button"
        class="menu-button"
        onclick="openMenu('dashboard')"
      >
        <span>🏠</span>
        endy
      </button>

      <button
        type="button"
        class="menu-button"
        onclick="openMenu('data')"
      >
        <span>👤</span>
        alwi
      </button>

      <button
        type="button"
        class="menu-button"
        onclick="openMenu('settings')"
      >
        <span>⚙️</span>
        tonny
      </button>

      <button
        type="button"
        class="menu-button"
        onclick="openMenu('help')"
      >
        <span>💬</span>
        siti
      </button>

    </div>

    <section id="pageContent" class="page-content">
      <h2 id="contentTitle"></h2>
      <p id="contentText"></p>

      <button
        type="button"
        class="back-button"
        onclick="backToMenu()"
      >
        Kembali ke Menu
      </button>
    </section>
  </main>

  <script>
    const mainMenu =
      document.getElementById("mainMenu");

    const pageContent =
      document.getElementById("pageContent");

    const contentTitle =
      document.getElementById("contentTitle");

    const contentText =
      document.getElementById("contentText");

    const menuContent = {
      dashboard: {
        title: "Dashboard",
        text: "Selamat datang di halaman dashboard utama."
      },

      data: {
        title: "Data Pengguna",
        text: "Halaman untuk menampilkan dan mengelola data pengguna."
      },

      settings: {
        title: "Pengaturan",
        text: "Halaman untuk mengatur tampilan dan sistem."
      },

      help: {
        title: "Bantuan",
        text: "Silakan hubungi administrator jika Anda mengalami kendala."
      }
    };

    function openMenu(menu) {
      contentTitle.textContent =
        menuContent[menu].title;

      contentText.textContent =
        menuContent[menu].text;

      mainMenu.style.display = "none";
      pageContent.style.display = "block";
    }

    function backToMenu() {
      pageContent.style.display = "none";
      mainMenu.style.display = "grid";
    }
  </script>
</body>
</html>
